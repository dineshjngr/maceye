name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run checks
        run: Scripts/test.sh

      - name: Build
        run: ./build.sh

      - name: Verify the app bundle
        run: |
          codesign --verify --deep --strict build/Release/MacEye.app
          test -d build/Release/MacEye.app/Contents/PlugIns/MacEyeWidget.appex
          lipo -archs build/Release/MacEye.app/Contents/MacOS/MacEye
