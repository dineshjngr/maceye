name: Release

# Runs when a version tag such as v0.1.0 is pushed.
# Builds the app on a clean GitHub machine and attaches the zip to a new release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check that the tag matches the project version
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' MacEye.xcodeproj/project.pbxproj | head -1)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match project version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run checks
        run: Scripts/test.sh

      - name: Build and package
        run: Scripts/package.sh

      - name: Write release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Download"
            echo
            echo "\`MacEye-$VERSION.zip\` — universal app for Apple silicon and Intel, macOS 15 or later."
            echo
            echo "SHA-256: \`$(shasum -a 256 "build/MacEye-$VERSION.zip" | cut -d ' ' -f 1)\`"
            echo
            echo "This build is ad-hoc signed and **not notarized**. macOS blocks the first launch."
            echo "Open **System Settings › Privacy & Security** and click **Open Anyway**, or build from source."
            echo "See the README for details."
          } >> notes.md
          cat notes.md

      - name: Publish the release
        run: |
          gh release create "$TAG" "build/MacEye-$VERSION.zip" \
            --title "MacEye $VERSION" \
            --notes-file notes.md \
            --verify-tag
