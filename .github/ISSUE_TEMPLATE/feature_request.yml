name: Feature request
description: Suggest an idea for MacEye
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Please search existing issues first.
        MacEye stays fully offline, so ideas that need a network connection are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Describe what you imagine. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to help?
      options:
        - label: I could work on a pull request for this.
